; PlatformIO Project Configuration File for ESP32 Flight Controller
; -----------------------------------------------------------------

[platformio]
default_envs = esp32dev
src_dir = flight_controller

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
